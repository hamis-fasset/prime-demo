<!doctype html>
<!-- Dev harness: the app inside a phone-sized frame, because media queries
     respond to the iframe viewport. Serve the folder and open this file to
     check the ≤600px layer without resizing your browser. Not part of the
     bundle (build-bundle.py reads index.html only). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prime · phone preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 40px; background: #2a2a28; font: 12px -apple-system, sans-serif; }
  .frame { border-radius: 28px; padding: 10px; background: #111; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
  .frame iframe { display: block; width: 390px; height: 760px; border: 0; border-radius: 20px; background: #fff; }
  .cap { color: #999; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div>
  <div class="frame"><iframe src="index.html"></iframe></div>
  <div class="cap">390 × 760 · iPhone-ish</div>
</div>
</body>
</html>
